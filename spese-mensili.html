<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap');
:root{--bg:#0d0d14;--bg2:#12121c;--bg3:#1a1a26;--b1:#1e1e2c;--b2:#2a2a3e;--tx:#f0ede8;--mu:#555;--mu2:#777;--ac:#3d6bfd;--ac2:#6b8aff;--bl:#a0c4ff;--rd:#EF5350;--or:#FFB300;--gn:#4CAF50;--g2:#6dcc6d}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:'DM Sans',sans-serif;overflow-x:hidden}
input,select,button,textarea{font-family:'DM Sans',sans-serif}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ac)!important}
::-webkit-scrollbar{width:2px}::-webkit-scrollbar-thumb{background:var(--b2);border-radius:2px}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
/* ── Login ── */
#login{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:40px 24px;text-align:center;background:radial-gradient(ellipse at 50% 0%,#1a1a3e,var(--bg) 70%)}
#login h1{font-family:'Playfair Display',serif;font-size:44px;font-weight:900;letter-spacing:-1px;margin-bottom:6px}
#login .sub{color:var(--mu2);font-size:12px;letter-spacing:3px;text-transform:uppercase;margin-bottom:40px}
.lcard{background:var(--bg2);border:1px solid var(--b2);border-radius:24px;padding:28px 20px;width:100%;max-width:340px;margin-bottom:20px}
.lcard .ico{font-size:48px;margin-bottom:16px}
.lcard h2{font-size:18px;font-weight:600;margin-bottom:6px}
.lcard p{color:var(--mu2);font-size:13px;line-height:1.6;margin-bottom:24px}
.linfo{font-size:11px;color:var(--mu);line-height:2}
.linfo span{color:var(--g2)}
/* ── App ── */
#app{display:none;flex-direction:column;height:100vh}
#app.on{display:flex}
/* ── Header ── */
#hd{background:var(--bg);border-bottom:1px solid var(--b1);padding:16px 18px 0;position:sticky;top:0;z-index:10;flex-shrink:0}
.hd-top{display:flex;justify-content:space-between;align-items:flex-start;max-width:480px;margin:0 auto}
.hd-top h1{font-family:'Playfair Display',serif;font-size:24px;font-weight:900;letter-spacing:-.5px}
.hd-sub{font-size:10px;color:var(--mu);letter-spacing:3px;text-transform:uppercase;margin-top:1px}
.hd-right{text-align:right}
.hd-lbl{font-size:10px;color:var(--mu);letter-spacing:1px;text-transform:uppercase}
.hd-amt{font-size:22px;color:var(--bl);font-weight:600;letter-spacing:-.5px}
.nav{display:flex;gap:4px;margin:12px auto 0;max-width:480px}
.nav button{flex:1;padding:9px 0;border-radius:10px;border:none;background:transparent;color:var(--mu);font-size:11px;cursor:pointer;text-transform:uppercase;letter-spacing:1.5px;font-weight:500;border-bottom:2px solid transparent;transition:all .2s}
.nav button.on{color:var(--bl);border-bottom-color:var(--ac)}
/* ── Content ── */
#cnt{flex:1;overflow-y:auto;padding:18px;max-width:480px;width:100%;margin:0 auto;padding-bottom:48px}
/* ── Buttons ── */
.brow{display:flex;gap:8px;margin-bottom:8px}
.bact{flex:1;padding:14px 10px;border-radius:14px;border:2px dashed var(--ac);background:rgba(61,107,253,.06);color:var(--bl);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px;transition:all .2s}
.bact:active{transform:scale(.97)}
.bact .ico{font-size:24px}
.bact .lbl{font-size:10px;letter-spacing:1px;text-transform:uppercase;font-weight:500}
.bpicker{width:100%;padding:11px;border-radius:12px;border:1px solid #1c3a1a;background:#0d1e0d;color:var(--g2);font-size:13px;cursor:pointer;margin-bottom:6px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:500}
.bsm{width:100%;padding:9px;border-radius:10px;border:1px solid var(--b1);background:transparent;color:var(--mu2);font-size:12px;cursor:pointer;margin-bottom:14px;letter-spacing:1px}
.bpri{flex:2;padding:13px;border-radius:12px;border:none;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;font-size:14px;font-weight:600;cursor:pointer;box-shadow:0 4px 20px rgba(61,107,253,.3)}
.bsec{flex:1;padding:13px;border-radius:12px;border:2px solid var(--b2);background:transparent;color:var(--mu2);font-size:14px;cursor:pointer}
.bdl{width:100%;margin-top:6px;padding:13px;border-radius:14px;border:none;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:500}

.bdl.q8{background:linear-gradient(135deg,#3a1b1b,#5a2a2a);color:#ff8a80}
.lbar{width:100%;padding:14px;border-radius:14px;border:2px dashed var(--b1);background:#10101a;color:var(--mu);font-size:14px;display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:8px}
.sp{display:inline-block;animation:spin 1s linear infinite}
/* ── Cards ── */
.card{background:var(--bg2);border-radius:14px;overflow:hidden;border:1px solid var(--b1);animation:fadeUp .3s ease;margin-bottom:8px}
.ci{display:flex}
.cimg{width:64px;height:64px;object-fit:cover;flex-shrink:0}
.cph{width:64px;height:64px;background:var(--bg3);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:22px}
.cb{padding:10px 12px;flex:1}
.ct{display:flex;justify-content:space-between;align-items:flex-start}
.cn{font-size:13px;font-weight:600;color:var(--tx)}
.cd{font-size:10px;color:var(--mu);margin-top:1px}
.ca{font-size:15px;font-weight:700}
.cc{display:flex;justify-content:space-between;align-items:center;margin-top:7px}
.badge{font-size:10px;padding:2px 7px;border-radius:5px}
.bdel{background:none;border:none;color:var(--mu);cursor:pointer;font-size:14px;padding:0 2px}
.err{margin-bottom:12px;padding:10px 14px;background:#3e1515;border-radius:12px;color:#ff8a80;font-size:12px}

.ov{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:100;display:flex;align-items:flex-end;justify-content:center}
.ovc{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px}
.mo{background:#14141f;border-radius:22px 22px 0 0;width:100%;max-width:480px;padding:24px 18px 34px;max-height:92vh;overflow-y:auto;border-top:2px solid var(--b2);animation:slideUp .3s ease}
.moc{background:#14141f;border-radius:20px;padding:22px;width:100%;max-width:340px;border:1px solid var(--b2)}

/* ── Riepilogo ── */
.tabs{display:flex;gap:5px;margin-bottom:16px}
.tb{flex:1;padding:8px 0;border-radius:9px;border:none;background:transparent;color:var(--mu);font-size:10px;cursor:pointer;text-transform:uppercase;letter-spacing:1px;border-bottom:2px solid transparent;font-weight:500;transition:all .2s}
.tb.on{background:#1c2540;color:var(--bl);border-bottom-color:var(--ac)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:460px;font-family:'DM Sans',sans-serif}
th{padding:8px 7px;color:var(--mu);text-align:left;border-bottom:1px solid var(--b1);font-size:10px;text-transform:uppercase;letter-spacing:1px;font-weight:500;white-space:nowrap}
td{padding:9px 7px;font-size:12px;border-bottom:1px solid #171724}
tfoot td{background:#1c1c2e;font-weight:700;border:none}
.cl{background:var(--bg2);border-radius:14px;overflow:hidden}
.cr{display:grid;grid-template-columns:1fr 38px 85px;padding:11px 15px;border-bottom:1px solid #0f0f1a;align-items:center}
.crh{padding:9px 15px;border-bottom:1px solid var(--b1)}
.crf{background:#1c1c2e}
/* ── Export section ── */
.expsec{background:var(--bg2);border-radius:14px;padding:14px;margin-top:10px;border:1px solid var(--b1)}
.exptt{font-size:11px;color:var(--mu2);letter-spacing:2px;text-transform:uppercase;margin-bottom:10px}
/* ── Gmail scanner ── */
.gmail-item{display:flex;align-items:flex-start;gap:10px;padding:11px 12px;border-radius:12px;border:1px solid var(--b1);margin-bottom:7px;background:var(--bg2);cursor:pointer;transition:all .15s}
.gmail-item.verde{border-color:#2a5a2a;background:#0d1a0d}
.gmail-item.gialla{border-color:#5a4a0a;background:#1a1500}
.gmail-item.sel{box-shadow:0 0 0 2px var(--gn)}
.gmail-item.sel.gialla{box-shadow:0 0 0 2px var(--or)}
.gmail-badge{font-size:9px;padding:2px 6px;border-radius:4px;font-weight:600;letter-spacing:.5px}

.gmail-badge.g{background:#3a2a00;color:var(--or)}
.gmail-chk{width:20px;height:20px;border-radius:5px;border:2px solid var(--b2);background:transparent;flex-shrink:0;display:flex;align-items:center;justify-content:center;margin-top:1px;transition:all .15s}
.gmail-chk.on{background:var(--gn);border-color:var(--gn)}
/* ── Session (foto in corso) ── */
.sess{background:#0d1e0d;border:1px solid #1a3a1a;border-radius:14px;padding:14px;margin-bottom:10px}
.sess-t{font-size:13px;font-weight:600;color:var(--g2);margin-bottom:4px}
.sess-s{font-size:11px;color:var(--mu2);margin-bottom:12px}
.sess-count{font-size:28px;font-weight:700;color:var(--g2);text-align:center;margin:8px 0}
</style>
</head>

<script src="https://accounts.google.com/gsi/client" async defer></script>

<script>
// ═══════════════════════ CONFIG ═══════════════════════
const CLIENT_ID='942404693526-riko3njld4ekjtcf44g194luscmv9oao.apps.googleusercontent.com';
const API_KEY='AIzaSyCTsM4gHFG9qSF02dsNwO0rD6WUpo5-a9g';
const SCOPES='https://www.googleapis.com/auth/drive.file https://www.googleapis.com/auth/drive.readonly https://www.googleapis.com/auth/gmail.readonly';

const MESI=['','GENNAIO','FEBBRAIO','MARZO','APRILE','MAGGIO','GIUGNO','LUGLIO','AGOSTO','SETTEMBRE','OTTOBRE','NOVEMBRE','DICEMBRE'];
const CATS=[
  {n:'Ristoranti',e:'🍽️',c:'#FF7043'},{n:'Alloggio',e:'🏨',c:'#29B6F6'},

const EMJS=['🛒','🍽️','💊','🚌','🏠','🚗','⛽','📦','💈','🏋️','🎬','✈️','🐾','📚','🎮','💻','👔','🌿'];

// ═══════════════════════ STATE ═══════════════════════
let tok=null, gapiOk=false, gisOk=false;
let sc=[], cats=[], kmP=139900, cur='home';

function load(){
  try{sc=JSON.parse(localStorage.getItem('sm_sc')||'[]');}catch{sc=[];}
  try{cats=JSON.parse(localStorage.getItem('sm_cat')||'null')||[...CATS];}catch{cats=[...CATS];}
  try{kmP=JSON.parse(localStorage.getItem('sm_km')||'139900');}catch{kmP=139900;}
  try{tok=localStorage.getItem('sm_tok')||null;}catch{}
}
function save(){
  try{localStorage.setItem('sm_sc',JSON.stringify(sc.map(({preview,...r})=>r)));}catch{}
  try{localStorage.setItem('sm_cat',JSON.stringify(cats));}catch{}
  try{localStorage.setItem('sm_km',JSON.stringify(kmP));}catch{}
}

// ═══════════════════════ AUTH ═══════════════════════
function initGis(){
  window._tc=google.accounts.oauth2.initTokenClient({
    client_id:CLIENT_ID,scope:SCOPES,
    callback:(r)=>{if(r.access_token){tok=r.access_token;localStorage.setItem('sm_tok',tok);startApp();}}
  });
  gisOk=true;
}
function doLogin(){
  if(!gisOk){setTimeout(doLogin,300);return;}
  window._tc.requestAccessToken({prompt:'consent'});
}

// ═══════════════════════ AI ═══════════════════════
const AI_HDR={'Content-Type':'application/json','anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'};

// Categorie Excel: mappa categoria app → colonna nota spese
const CAT_EXCEL={
  'Ristoranti':'ristorazione','Alimentari':'alimentari',
  'Gasolio':'gasolio','Automobile':'auto','Alloggio':'alloggio',
  'Trasporti':'trasporti','Farmacia':'altro','Casa':'altro','Altro':'altro'
};

async function aiImg(b64,mt){
  const nc=cats.map(c=>c.n).join(', ');
  try{
    const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:AI_HDR,
      body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1000,
        messages:[{role:'user',content:[
          {type:'image',source:{type:'base64',media_type:mt||'image/jpeg',data:b64}},
          {type:'text',text:`Analizza questo scontrino/ricevuta. Rispondi SOLO con JSON valido, niente markdown, niente testo extra.

Se è uno scontrino di CARBURANTE/GASOLIO (distributore benzina/diesel):
{"negozio":"nome stazione","data":"GG/MM/AAAA","totale":importo_numerico,"categoria":"Gasolio","pagamento":"POS o Contanti","km":chilometraggio_intero_o_null,"litri":litri_numero_o_null,"prezzoLitro":prezzo_per_litro_numero_o_null,"stazione":"nome stazione completo"}

Se è PARCHEGGIO, LAVAGGIO AUTO, PEDAGGI, AUTOSTRADA:
{"negozio":"descrizione","data":"GG/MM/AAAA","totale":importo_numerico,"categoria":"Automobile","pagamento":"POS o Contanti","km":null,"litri":null,"prezzoLitro":null,"stazione":null}

Se è RISTORANTE, BAR, AUTOGRILL, MENSA, VITTO:
{"negozio":"nome locale","data":"GG/MM/AAAA","totale":importo_numerico,"categoria":"Ristoranti","pagamento":"POS o Contanti","km":null,"litri":null,"prezzoLitro":null,"stazione":null}

Se è SUPERMERCATO, ALIMENTARI, SPESA:
{"negozio":"nome negozio","data":"GG/MM/AAAA","totale":importo_numerico,"categoria":"Alimentari","pagamento":"POS o Contanti","km":null,"litri":null,"prezzoLitro":null,"stazione":null}

Se è HOTEL, ALBERGO, B&B, PENSIONE, AFFITTACAMERE, NOTTE:
{"negozio":"nome struttura","data":"GG/MM/AAAA","totale":importo_numerico,"categoria":"Alloggio","pagamento":"POS o Contanti","km":null,"litri":null,"prezzoLitro":null,"stazione":null}

Altrimenti usa categoria da: ${nc}
{"negozio":"nome","data":"GG/MM/AAAA","totale":importo_numerico,"categoria":"categoria_giusta","pagamento":"POS o Contanti","km":null,"litri":null,"prezzoLitro":null,"stazione":null}

IMPORTANTE per gasolio: i km sono quelli del contachilometri (5 o 6 cifre), NON i litri.`}
        ]}]})});
    const d=await r.json();
    if(d.error)throw new Error(d.error.message);
    const txt=d.content.map(b=>b.text||'').join('').replace(/```json|```/g,'').trim();
    return JSON.parse(txt.slice(txt.indexOf('{'),txt.lastIndexOf('}')+1));
  }catch(e){console.error('AI err:',e);return {negozio:'',data:'',totale:'',categoria:'Altro',pagamento:'POS'};}
}
async function aiPdf(txt){
  const nc=cats.map(c=>c.n).join(', ');
  try{
    const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:AI_HDR,
      body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:800,
        messages:[{role:'user',content:`Se è uno scontrino di pagamento rispondi con JSON: {"negozio":"...","data":"GG/MM/AAAA","totale":numero,"categoria":"una tra: ${nc}","pagamento":"POS o Contanti","commissioni":null,"km":null,"litri":null,"prezzoLitro":null}. Se NON è uno scontrino: {"skip":true}.\n\nTesto:\n${txt.slice(0,3000)}`}]})});
    const d=await r.json();
    if(d.error)throw new Error(d.error.message);
    const t=d.content.map(b=>b.text||'').join('').replace(/```json|```/g,'').trim();
    return JSON.parse(t.slice(t.indexOf('{'),t.lastIndexOf('}')+1));
  }catch(e){console.error('PDF err:',e);return {skip:true};}
}
function b64(blob){return new Promise((ok,ko)=>{const r=new FileReader();r.onload=()=>ok(r.result.split(',')[1]);r.onerror=ko;r.readAsDataURL(blob);});}

// ═══════════════════════ DRIVE BROWSER (no Picker) ═══════════════════════
const ZZZ_ID='1spHTpaE1kQKTlzMc9C0bn7KXG89hne2L';

// Naviga Drive con API diretta — nessun Picker esterno
async function driveList(parentId){
  // NON fare encodeURIComponent — fetch URL-encoda i parametri da solo se usi URLSearchParams
  const params=new URLSearchParams({
    q:`'${parentId}' in parents and trashed=false`,
    orderBy:'name',
    fields:'files(id,name,mimeType)',
    pageSize:'100',
    includeItemsFromAllDrives:'true',
    supportsAllDrives:'true'
  });
  const url=`https://www.googleapis.com/drive/v3/files?${params}`;
  const r=await fetch(url,{headers:{Authorization:'Bearer '+tok}});
  const d=await r.json();
  if(d.error){console.error('Drive API error:',d.error,url);throw new Error(d.error.message);}
  return d.files||[];
}

  }
  _dbSelected=[];
  mostraBrowser(ZZZ_ID,'📁 ZZZ NOTA SPESE',[]);
}

async function mostraBrowser(folderId, folderName, breadcrumb){
  close_('_db');
  const ov=document.createElement('div');ov.className='ov';ov.id='_db';

  ov.innerHTML=`<div class="mo">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <div style="font-size:15px;font-weight:700;font-family:'Playfair Display',serif">☁️ Drive</div>
      <button onclick="close_('_db')" style="background:none;border:none;color:var(--mu2);font-size:20px;cursor:pointer">✕</button>
    </div>
    <!-- Breadcrumb -->
    <div style="font-size:11px;color:var(--mu2);margin-bottom:10px;padding:6px 10px;background:var(--bg3);border-radius:8px;line-height:1.6">
      ${folderName}
    </div>
    <div id="db-list" style="min-height:120px;display:flex;align-items:center;justify-content:center">
      <span style="color:var(--mu);font-size:13px">⏳ Carico...</span>
    </div>
    <div id="db-sel" style="display:none;margin-top:10px">
      <div style="font-size:11px;color:var(--g2);margin-bottom:8px" id="db-sel-count">0 file selezionati</div>
      <button class="bpri" style="width:100%" onclick="importaSelezionati()">✓ Importa selezionati</button>
    </div>
    <button class="bsec" style="width:100%;margin-top:8px" onclick="close_('_db')">Annulla</button>
  </div>`;
  ov._breadcrumb=breadcrumb;
  ov._selected=[];
  document.body.appendChild(ov);

  // Carica contenuto cartella
  try{
    const files=await driveList(folderId);
    const listEl=document.getElementById('db-list');
    if(!files.length){listEl.innerHTML='<span style="color:var(--mu);font-size:13px">Cartella vuota</span>';return;}

    const folders=files.filter(f=>f.mimeType==='application/vnd.google-apps.folder');
    const docs=files.filter(f=>f.mimeType!=='application/vnd.google-apps.folder'&&
      (f.mimeType.startsWith('image/')||f.mimeType==='application/pdf'));

    // Salva dati cartelle nell'overlay per navigazione sicura
    const newBreadcrumb=[...breadcrumb,{id:folderId,name:folderName}];
    ov._folderData={folders, docs, breadcrumb:newBreadcrumb, currentId:folderId, currentName:folderName};

    let html='';

    // Torna indietro
    if(breadcrumb.length>0){
      html=`<div id="db-back" style="display:flex;align-items:center;gap:10px;padding:11px 12px;background:#1a1a0d;border-radius:10px;margin-bottom:6px;cursor:pointer;border:1px solid #2a2a1a">
        <span style="font-size:18px">⬆️</span>
        <span style="font-size:13px;color:var(--or)">↑ Torna su</span>
      </div>`;
    }

    // Cartelle navigabili
    folders.forEach((f,idx)=>{
      html+=`<div data-folder-idx="${idx}" style="display:flex;align-items:center;gap:10px;padding:11px 12px;background:var(--bg2);border-radius:10px;margin-bottom:6px;cursor:pointer;border:1px solid var(--b1)">
        <span style="font-size:20px">📁</span>
        <span style="font-size:14px;color:var(--tx)">${f.name}</span>
        <span style="margin-left:auto;color:var(--mu)">›</span>
      </div>`;
    });

    // File selezionabili
    if(docs.length){
      html+=`<div style="font-size:10px;color:var(--mu);letter-spacing:2px;text-transform:uppercase;margin:10px 0 6px">File da importare</div>`;
      docs.forEach(f=>{
        const ico=f.mimeType==='application/pdf'?'📄':'🖼️';
        html+=`<div id="fi-${f.id}" onclick="toggleFile('${f.id}','${f.name}','${f.mimeType}')"
          style="display:flex;align-items:center;gap:10px;padding:11px 12px;background:var(--bg2);border-radius:10px;margin-bottom:6px;cursor:pointer;border:1px solid var(--b1);transition:all .15s">
          <span style="font-size:18px">${ico}</span>
          <span style="font-size:13px;color:var(--tx);flex:1">${f.name}</span>
          <span id="chk-${f.id}" style="font-size:18px;color:var(--mu)">○</span>
        </div>`;
      });
    } else if(!folders.length){
      html+='<div style="color:var(--mu);font-size:12px;text-align:center;padding:10px">Nessun file PDF o immagine</div>';
    }

    listEl.innerHTML=html;
    // Aggiungi event listener dopo render
    setTimeout(()=>{
      const dbOv=document.getElementById('_db');
      if(!dbOv)return;
      const fd=dbOv._folderData;
      // Back button
      const backBtn=document.getElementById('db-back');
      if(backBtn&&fd){
        backBtn.onclick=()=>{
          const prev=fd.breadcrumb[fd.breadcrumb.length-2];
          if(prev)mostraBrowser(prev.id,prev.name,fd.breadcrumb.slice(0,-2));
        };
      }
      // Folder buttons
      document.querySelectorAll('[data-folder-idx]').forEach(el=>{
        el.onclick=()=>{
          const idx=parseInt(el.getAttribute('data-folder-idx'));
          const folder=fd.folders[idx];
          if(folder)mostraBrowser(folder.id,'📁 '+folder.name,fd.breadcrumb);
        };
      });
    },100);
  }catch(e){
    console.error('Browser err:',e);
    document.getElementById('db-list').innerHTML=`<div style="color:#ff8a80;font-size:12px;padding:12px">
      ❌ ${e.message}<br><br>
      <button onclick="tok=null;localStorage.removeItem('sm_tok');location.reload()" 
        style="background:#3d6bfd;color:#fff;border:none;border-radius:8px;padding:8px 16px;cursor:pointer;font-size:12px">
        🔄 Rieffettua il login
      </button>
    </div>`;
  }
}

let _dbSelected=[];
window.toggleFile=(id,name,mime)=>{
  const idx=_dbSelected.findIndex(f=>f.id===id);
  const chk=document.getElementById('chk-'+id);
  const row=document.getElementById('fi-'+id);
  if(idx>=0){
    _dbSelected.splice(idx,1);
    if(chk)chk.textContent='○';if(chk)chk.style.color='var(--mu)';
    if(row)row.style.borderColor='var(--b1)';if(row)row.style.background='var(--bg2)';
  }else{
    _dbSelected.push({id,name,mimeType:mime});
    if(chk)chk.textContent='✓';if(chk)chk.style.color='var(--g2)';
    if(row)row.style.borderColor='var(--gn)';if(row)row.style.background='#0d1a0d';
  }
  const selDiv=document.getElementById('db-sel');
  const cntEl=document.getElementById('db-sel-count');
  if(selDiv)selDiv.style.display=_dbSelected.length>0?'block':'none';
  if(cntEl)cntEl.textContent=`${_dbSelected.length} file selezionati`;
};

async function importaSelezionati(){
  const files=[..._dbSelected];
  _dbSelected=[];
  close_('_db');
  if(!files.length)return;
  let i=0;
  const next=async()=>{
    if(i>=files.length){render();return;}
    const f=files[i];
    spin(true,`Analizzo ${f.name} (${i+1}/${files.length})...`);
    try{
      let p=null;
      if(f.mimeType&&f.mimeType.startsWith('image/')){
        const res=await fetch(`https://www.googleapis.com/drive/v3/files/${f.id}?alt=media`,{headers:{Authorization:'Bearer '+tok}});
        const blob=await res.blob();
        const data=await b64(blob);
        p=await aiImg(data,f.mimeType);
      }else if(f.mimeType==='application/pdf'){
        const res=await fetch(`https://www.googleapis.com/drive/v3/files/${f.id}/export?mimeType=text/plain`,{headers:{Authorization:'Bearer '+tok}});
        if(res.ok){const txt=await res.text();p=await aiPdf(txt);}
      }
      spin(false);
      if(p&&!p.skip){
        confirm_({...p},(form)=>{sc.push({...form,id:Date.now(),fromDrive:true});if(form.categoria==='Gasolio'&&form.km)kmP=parseFloat(form.km);save();i++;next();},{idx:i,tot:files.length,fname:f.name,fromDrive:true});
      }else{i++;next();}
    }catch(e){spin(false);i++;next();}
  };
  next();
}

// Legge i km finali dell'Excel del mese precedente da Drive
async function leggiKmMesePrecedente(annoId, mesePrecedente){
  try{
    const mm=String(mesePrecedente).padStart(2,'0');
    // Cerca la cartella del mese precedente
    const res=await fetch(
      `https://www.googleapis.com/drive/v3/files?q='${annoId}' in parents and mimeType='application/vnd.google-apps.folder' and name contains '${mm}'&fields=files(id,name)`,
      {headers:{Authorization:'Bearer '+tok}});
    const data=await res.json();
    if(!data.files||!data.files.length)return null;
    const meseId=data.files[0].id;
    // Cerca il file Excel dentro quella cartella
    const res2=await fetch(
      `https://www.googleapis.com/drive/v3/files?q='${meseId}' in parents and (name contains '.xlsx' or mimeType='application/vnd.openxmlformats-officedocument.spreadsheetml.sheet')&fields=files(id,name)`,
      {headers:{Authorization:'Bearer '+tok}});
    const data2=await res2.json();
    if(!data2.files||!data2.files.length)return null;
    const xlsxId=data2.files[0].id;
    // Scarica ed analizza con AI per trovare ultimi km Q8
    const res3=await fetch(`https://www.googleapis.com/drive/v3/files/${xlsxId}/export?mimeType=text/csv`,{headers:{Authorization:'Bearer '+tok}});
    if(!res3.ok)return null;
    const csv=await res3.text();
    // Cerca l'ultimo valore numerico nella colonna km (cerca pattern di km > 10000)
    const matches=csv.match(/\b(\d{5,6})\b/g);
    if(!matches)return null;
    const nums=matches.map(Number).filter(n=>n>10000&&n<999999);
    if(!nums.length)return null;
    return nums[nums.length-1];
  }catch(e){console.error('km err:',e);return null;}
}

// Session: prende foto in sequenza finché l'utente non dice "ho finito"
let sessQueue=[];
let sessActive=false;
let sessResolve=null;

function startSessione(){
  sessQueue=[];
  sessActive=true;
  render(); // mostra schermata sessione
}

function addFotoSess(file){
  // aggiunge foto alla coda sessione
  sessQueue.push(file);
  document.getElementById('sess-cnt')&&(document.getElementById('sess-cnt').textContent=sessQueue.length);
}

async function fineSessione(){
  sessActive=false;
  if(!sessQueue.length){render();return;}
  let i=0;
  const next=async()=>{
    if(i>=sessQueue.length){render();return;}
    const file=sessQueue[i];
    spin(true,`Analizzo foto ${i+1}/${sessQueue.length}...`);
    const prev=URL.createObjectURL(file);
    try{
      const data=await b64(file);
      const p=await aiImg(data,file.type||'image/jpeg');
      spin(false);
      confirm_({...p,preview:prev},form=>{sc.push({...form,id:Date.now(),preview:prev});if(form.categoria==='Gasolio'&&form.km)kmP=parseFloat(form.km);save();i++;next();},{idx:i,tot:sessQueue.length});
    }catch{
      spin(false);
      confirm_({negozio:'',data:'',totale:'',categoria:'Altro',pagamento:'POS',preview:prev},form=>{sc.push({...form,id:Date.now(),preview:prev});save();i++;next();},{idx:i,tot:sessQueue.length});
    }
  };
  next();
}

async function handleFile(e){
  const file=e.target.files[0];if(!file)return;e.target.value='';
  if(sessActive){addFotoSess(file);renderSess();return;}
  spin(true,'Analisi AI...');
  const prev=URL.createObjectURL(file);
  try{
    const data=await b64(file);
    const p=await aiImg(data,file.type||'image/jpeg');
    spin(false);
    confirm_({...p,preview:prev},form=>{sc.push({...form,id:Date.now(),preview:prev});if(form.categoria==='Gasolio'&&form.km)kmP=parseFloat(form.km);save();render();});
  }catch{spin(false);confirm_({negozio:'',data:'',totale:'',categoria:'Altro',pagamento:'POS',preview:prev},form=>{sc.push({...form,id:Date.now(),preview:prev});save();render();});}
}

// ═══════════════════════ SPINNER ═══════════════════════
function spin(on,msg=''){
  let el=document.getElementById('_sp');
  if(on){
    if(!el){el=document.createElement('div');el.id='_sp';el.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px';
      el.innerHTML=`<div style="font-size:38px;animation:spin 1s linear infinite">⏳</div><div id="_spm" style="color:#fff;font-size:13px;text-align:center;padding:0 28px"></div>`;document.body.appendChild(el);}
    document.getElementById('_spm').textContent=msg;
  }else{if(el)el.remove();}
}

// ═══════════════════════ CONFIRM MODAL ═══════════════════════
// Campi obbligatori: data e totale. Negozio obbligatorio.
// Se mancanti, evidenzia in rosso e blocca il salvataggio.
function campiMancanti(d){
  // Determina quali campi sono stati rilevati dall'AI
  const mancanti=[];
  if(!d.negozio||d.negozio.trim()==='')mancanti.push('negozio');
  if(!d.data||d.data.trim()==='')mancanti.push('data');
  if(!d.totale&&d.totale!==0)mancanti.push('totale');
  return mancanti;
}

function confirm_(d,cb,extra={}){
  close_('_mc');
  const mancanti=campiMancanti(d);
  const hasMissing=mancanti.length>0;
  const ov=document.createElement('div');ov.className='ov';ov.id='_mc';

  // Banner avviso campi mancanti
  const banner=hasMissing?`
    <div style="background:#3a1a0a;border:1px solid #ff6a00;border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:12px;color:#ffaa55;line-height:1.6">
      ⚠️ <strong>Dati non rilevati automaticamente</strong><br>
      Compila i campi evidenziati in arancione per procedere.
    </div>`:'';

  // Helper per evidenziare campo mancante
  const ipStyle=(campo)=>mancanti.includes(campo)?'border-color:#ff6a00!important;background:#1a1000':'';

  ov.innerHTML=`<div class="mo">
    ${extra.idx!==undefined?`<div style="display:flex;justify-content:space-between;margin-bottom:10px">
      <span style="font-size:10px;color:var(--mu2);text-transform:uppercase;letter-spacing:2px">${extra.fromDrive?'Drive':'Foto'} · ${extra.idx+1}/${extra.tot}</span>
      <span style="font-size:10px;color:var(--mu)">${(extra.fname||'').slice(0,22)}</span></div>`:''}
    <div class="mts">Verifica e conferma</div>
    <div class="mt">${hasMissing?'⚠️ Completa i dati':'Dati scontrino'}</div>
    ${d.preview?`<img src="${d.preview}" style="width:100%;max-height:110px;object-fit:cover;border-radius:9px;margin-bottom:10px" alt="">`:''}
    ${banner}

    <div class="lb" style="${mancanti.includes('negozio')?'color:#ff6a00':''}">
      Negozio ${mancanti.includes('negozio')?'⚠️ obbligatorio':''}
    </div>
    <input class="ip" id="fn" value="${d.negozio||''}" placeholder="Es. Esselunga..." style="${ipStyle('negozio')}"
      oninput="checkReady()">

    <div class="lb" style="${mancanti.includes('data')?'color:#ff6a00':''}">
      Data ${mancanti.includes('data')?'⚠️ obbligatoria':''}
    </div>
    <input class="ip" id="fd" value="${d.data||''}" placeholder="GG/MM/AAAA" style="${ipStyle('data')}"
      oninput="checkReady()">

    <div class="lb">Categoria</div>
    <select class="ip" id="fc" onchange="toggleF();toggleNewCat()">
      ${cats.map(c=>`<option value="${c.n}" ${d.categoria===c.n?'selected':''}>${c.e} ${c.n}</option>`).join('')}
      <option value="__nuova__" ${!cats.find(c=>c.n===d.categoria)&&d.categoria?'selected':''}>➕ Nuova...</option>
    </select>
    <div id="fcnuova" style="display:${!cats.find(c=>c.n===d.categoria)&&d.categoria?'block':'none'}">
      <div class="lb">Nome categoria</div>
      <input class="ip" id="fcnn" placeholder="Es. Sport, Cinema..." value="${!cats.find(c=>c.n===d.categoria)&&d.categoria?d.categoria:''}" oninput="checkReady()">
    </div>

    <div class="lb" style="${mancanti.includes('totale')?'color:#ff6a00':''}">
      Importo (€) ${mancanti.includes('totale')?'⚠️ obbligatorio':''}
    </div>
    <input class="ip" id="ft" type="number" step="0.01" value="${d.totale||''}" placeholder="0.00"
      style="${ipStyle('totale')}" oninput="checkReady()">

    <div class="lb">Pagamento</div>
    <div class="pr">${['POS','Contanti','Entrambi'].map(p=>`<button class="pb ${(d.pagamento||'POS')===p?'pa':''}" onclick="selP(this,'${p}')">${p}</button>`).join('')}</div>

    <div id="fcr" style="display:${d.pagamento==='Contanti'||d.pagamento==='Entrambi'?'block':'none'}">

      <input class="ip" id="fco" type="number" step="0.01" value="${d.contanti||''}" placeholder="0.00">
    </div>

    <input class="ip" id="fcomm" type="number" step="0.01" value="${d.commissioni||''}" placeholder="0.00">

      <div class="kmh">Km partenza mese prec.: <strong>${kmP.toLocaleString()}</strong></div>

      <input class="ip" id="fkm" type="number" value="${d.km||''}" placeholder="${kmP}">

window.checkReady=()=>{
  // Aggiorna dinamicamente il bordo dei campi mentre l'utente li compila
  const fields={fn:'negozio',fd:'data',ft:'totale'};
  for(const [id,campo] of Object.entries(fields)){
    const el=document.getElementById(id);
    if(!el)continue;
    if(el.value.trim()){
      el.style.borderColor='var(--gn)'; // verde = compilato
      el.style.background='#0d1a0d';
    }
  }
};

window.toggleF=()=>{const f=document.getElementById('ff');if(f)f.style.display=document.getElementById('fc')?.value==='Gasolio'?'block':'none';};
window.toggleNewCat=()=>{const v=document.getElementById('fc')?.value;const d=document.getElementById('fcnuova');if(d)d.style.display=v==='__nuova__'?'block':'none';};
window.selP=(btn,v)=>{document.querySelectorAll('.pb').forEach(b=>b.classList.remove('pa'));btn.classList.add('pa');const r=document.getElementById('fcr');if(r)r.style.display=(v==='Contanti'||v==='Entrambi')?'block':'none';};

window.doConf=()=>{
  const el=document.getElementById('_mc');if(!el)return;
  // Valida campi obbligatori
  const negozio=document.getElementById('fn')?.value?.trim()||'';
  const data=document.getElementById('fd')?.value?.trim()||'';
  const totale=document.getElementById('ft')?.value||'';
  const categoria=document.getElementById('fc')?.value||'';
  const errori=[];
  if(!negozio)errori.push('Negozio');
  if(!data)errori.push('Data');
  if(!totale)errori.push('Importo');
  // Campi obbligatori extra per Gasolio
  if(categoria==='Gasolio'){
    const km=document.getElementById('fkm')?.value||'';
    const lt=document.getElementById('flt')?.value||'';
    const pl=document.getElementById('fpl')?.value||'';
    if(!km)errori.push('Km (carburante)');
    if(!lt)errori.push('Litri (carburante)');
    if(!pl)errori.push('Prezzo/litro (carburante)');
  }

  if(errori.length>0){
    const errBox=document.getElementById('err-conf');
    if(errBox){errBox.style.display='block';errBox.textContent='⚠️ Compila i campi obbligatori: '+errori.join(', ');}
    if(!negozio){const e=document.getElementById('fn');if(e){e.style.borderColor='#ff4444';e.style.background='#1a0a0a';e.focus();}}
    else if(!data){const e=document.getElementById('fd');if(e){e.style.borderColor='#ff4444';e.style.background='#1a0a0a';e.focus();}}
    else if(!totale){const e=document.getElementById('ft');if(e){e.style.borderColor='#ff4444';e.style.background='#1a0a0a';e.focus();}}
    else if(categoria==='Gasolio'){
      const km=document.getElementById('fkm')?.value||'';
      if(!km){const e=document.getElementById('fkm');if(e){e.style.borderColor='#ff4444';e.style.background='#1a0a0a';e.focus();}}
    }
    return;
  }

  const pay=el.querySelector('.pa');
  let catSel=document.getElementById('fc')?.value||'Altro';
  if(catSel==='__nuova__'){
    const nuovaNome=(document.getElementById('fcnn')?.value||'').trim();
    if(!nuovaNome){
      const errBox=document.getElementById('err-conf');
      if(errBox){errBox.style.display='block';errBox.textContent='⚠️ Inserisci il nome della nuova categoria';}
      document.getElementById('fcnn')?.focus();
      return;
    }
    catSel=nuovaNome;
    // Aggiungi categoria se non esiste già
    if(!cats.find(c=>c.n===nuovaNome)){
      cats.push({n:nuovaNome,e:'📋',c:'#90A4AE'});save();
    }
  }
  const form={
    negozio,data,
    totale:document.getElementById('ft')?.value||'',
    categoria:catSel,
    pagamento:pay?.textContent||'POS',
    contanti:document.getElementById('fco')?.value||'',
    commissioni:document.getElementById('fcomm')?.value||'',
    km:document.getElementById('fkm')?.value||'',
    litri:document.getElementById('flt')?.value||'',

function rSpese(){

function rGas(){
  const sp=sc.filter(s=>s.categoria==='Gasolio').sort((a,b)=>a.data>b.data?1:-1);
  const tS=sp.reduce((a,s)=>a+(parseFloat(s.totale)||0),0);
  return `<div class="tw"><table>
    <thead><tr><th>Data</th><th>Km</th><th>Litri</th><th>€/Lt</th><th>Totale</th><th>Δ km</th><th>Lt/100</th></tr></thead>

      const prev=sp[i-1];const kmN=parseFloat(s.km)||0;
      const pK=i===0?(parseFloat(s.kmPartenza)||kmP):(parseFloat(prev.km)||0);
      const dK=kmN&&pK?(kmN-pK):null;
      const lK=dK&&s.litri?(parseFloat(s.litri)/dK*100).toFixed(1):null;
      return `<tr><td style="color:var(--mu);white-space:nowrap">${s.data||'—'}</td>
        <td>${s.km?parseInt(s.km).toLocaleString():'—'}</td>
        <td>${s.litri?parseFloat(s.litri).toFixed(1):'—'}</td>

        <td style="color:var(--rd);font-weight:700">${s.totale?'€ '+parseFloat(s.totale).toFixed(2):'—'}</td>
        <td style="color:var(--mu2)">${dK!==null?Math.round(dK)+' km':'—'}</td>
        <td style="color:var(--or)">${lK?lK+' L':'—'}</td></tr>`;
    }).join('')}</tbody>
    ${sp.length>0?`<tfoot><tr><td colspan="4" style="color:var(--rd)">TOTALE</td><td style="color:var(--rd)">€ ${tS.toFixed(2)}</td><td colspan="2"></td></tr></tfoot>`:''}
  </table></div>`;
}

// ─── EXCEL ────────────────────────────────────────────
function expExcel(){
  const oggi=new Date();
  const mNum=oggi.getMonth()+1;
  const anno=oggi.getFullYear();
  const wb=XLSX.utils.book_new();

  // ── Foglio 1: Nota Spese ──
  const spGen=sc.filter(s=>s.categoria!=='Gasolio').sort((a,b)=>a.data>b.data?1:-1);
  // Header
  const nsData=[
    [`GENOVA - DIGA FASE B - C158 -`,'','','','','','','','',''],
    [`NOTA SPESA N. ${mNum} / ${String(anno).slice(2)} - D\'ANIELLO GIUSEPPE - Tessear n°4830********100`,'','','','','','','','',''],
    ['Giorno','Saldo Movimenti Carta','','Saldo contanti','Prelievo contanti','Pagamento in contanti','Pagamento con POS','Commissioni prelievo altre banche','DESCRIZIONE',''],
    ['mese precedente','- €','','','','','','','','']
  ];
  // Righe spese
  spGen.forEach(s=>{
    const pos=s.pagamento==='Contanti'?null:(parseFloat(s.totale)||null);
    const cont=s.pagamento==='Contanti'?(parseFloat(s.contanti||s.totale)||null):s.pagamento==='Entrambi'?(parseFloat(s.contanti)||null):null;
    const comm=s.commissioni?parseFloat(s.commissioni):null;
    nsData.push([s.data||'',null,null,cont,null,null,pos,comm,s.negozio||'','']);
  });
  // Totali
  const totPos=spGen.filter(s=>s.pagamento!=='Contanti').reduce((a,s)=>a+(parseFloat(s.totale)||0),0);
  const totCont=spGen.reduce((a,s)=>a+(parseFloat(s.contanti)||0),0);
  const totComm=spGen.reduce((a,s)=>a+(parseFloat(s.commissioni)||0),0);
  nsData.push(['',null,null,totCont>0?totCont:null,null,null,totPos>0?totPos:null,totComm>0?totComm:null,'','']);
  nsData.push(['Residuo Carta','','','','','','','€ 0.00','','']);
  nsData.push(['Residuo Contanti','','','','','','',`-€ ${totPos.toFixed(2)}`,'','']);
  nsData.push(['Credito Totale','','','','','','',`-€ ${totPos.toFixed(2)}`,'','']);
  nsData.push(['','','','','',totPos>0?totPos:null,'','','','']);
  const ws1=XLSX.utils.aoa_to_sheet(nsData);
  XLSX.utils.book_append_sheet(wb,ws1,`Nota_Spesa_${String(mNum).padStart(2,'0')}-${String(anno).slice(2)}`);

  // ── Foglio 2: Gasolio Q8 ──
  const gasoline=sc.filter(s=>s.categoria==='Gasolio').sort((a,b)=>a.data>b.data?1:-1);
  const q8Data=[
    [`NOTA SPESA N.${mNum}/${String(anno).slice(2)} - Q8- D\'ANIELLO GIUSEPPE - Tessear n°****01***700*20025`],
    ['','',' '+kmP.toLocaleString()],
    ['Giorno','Saldo Movimenti Carta','Saldo contanti','Pagamento carta','Pagamento in contanti','','Commissioni prelievo altre banche','km','','lt','d km','Lt/km']
  ];
  let prevKm=kmP;
  gasoline.forEach(s=>{
    const km=parseFloat(s.km)||0;
    const dKm=km&&prevKm?(km-prevKm):null;
    const lt=s.litri?parseFloat(s.litri):null;
    const ltKm=dKm&&lt?(lt/dKm).toFixed(6):null;
    const tot=s.totale?parseFloat(s.totale):null;
    q8Data.push([s.data||'',null,null,tot,null,null,null,km?km.toLocaleString():null,s.prezzoLitro?parseFloat(s.prezzoLitro):null,lt,dKm?Math.round(dKm):null,ltKm]);
    if(km)prevKm=km;
  });
  const totQ8=gasoline.reduce((a,s)=>a+(parseFloat(s.totale)||0),0);
  q8Data.push([null,null,null,totQ8>0?totQ8:null,null,null,null,null,null,null,null,null]);
  q8Data.push(['Residuo Carta','','',`-€ ${totQ8.toFixed(2)}`]);
  q8Data.push(['Residuo Contanti','','',`€ ${totQ8.toFixed(2)}`]);
  q8Data.push(['Credito Totale','','','€ 0.00']);
  const ws2=XLSX.utils.aoa_to_sheet(q8Data);
  XLSX.utils.book_append_sheet(wb,ws2,`Gasolio Q8 ${String(mNum).padStart(2,'0')}_${String(anno).slice(2)}`);

  XLSX.writeFile(wb,`Nota_spesa_${String(mNum).padStart(2,'0')}_${anno}.xlsx`);
}

function expPdfScontrini(){
  const ord=[...sc].sort((a,b)=>{
    const da=a.data?a.data.split('/').reverse().join(''):'0',db=b.data?b.data.split('/').reverse().join(''):'0';return da>db?1:-1;
  });
  const tot=sc.reduce((a,s)=>a+(parseFloat(s.totale)||0),0);
  const righe=ord.map((s,i)=>`
    <div style="page-break-inside:avoid;margin-bottom:24px;border:1px solid #ccd;border-radius:10px;overflow:hidden">
      <div style="background:#1e2040;color:#fff;padding:10px 14px;display:flex;justify-content:space-between;align-items:center">
        <div><div style="font-size:14px;font-weight:bold">${s.negozio||'Scontrino'}</div>
        <div style="font-size:10px;opacity:.6">${s.categoria} · ${s.data||'n.d.'} · ${s.pagamento||''}</div></div>
        <div style="font-size:16px;font-weight:bold">€ ${parseFloat(s.totale||0).toFixed(2)}</div>
      </div>
      ${s.preview?`<div style="background:#f8f8fa;text-align:center;padding:4px"><img src="${s.preview}" style="max-width:100%;max-height:320px;object-fit:contain"></div>`:'<div style="padding:12px;text-align:center;color:#aaa;font-size:12px">File da Google Drive</div>'}
      <div style="padding:6px 14px;font-size:10px;color:#666;display:flex;gap:12px;border-top:1px solid #eee">
        ${s.commissioni?`<span>Comm.: € ${parseFloat(s.commissioni).toFixed(2)}</span>`:''}
        ${s.km?`<span>Km: ${parseInt(s.km).toLocaleString()}</span>`:''}
        ${s.litri?`<span>Lt: ${parseFloat(s.litri).toFixed(1)}</span>`:''}
      </div>
    </div>`).join('');
  const html=`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Scontrini</title>
  <style>body{margin:0;padding:20px;font-family:Georgia,serif;max-width:700px;margin:0 auto}
  h1{font-size:22px;margin:0 0 3px}.meta{color:#888;font-size:11px;margin-bottom:20px;border-bottom:2px solid #eee;padding-bottom:12px}
  @media print{body{padding:0}}</style></head><body>
  <h1>Spese Mensili — Scontrini</h1>
  <div class="meta">D'Aniello Giuseppe · ${sc.length} scontrini · Totale: € ${tot.toFixed(2)}</div>

async function gmailFetch(path,params={}){
  const qs=new URLSearchParams(params).toString();
  const url=`https://gmail.googleapis.com/gmail/v1${path}${qs?'?'+qs:''}`;
  const r=await fetch(url,{headers:{Authorization:'Bearer '+tok}});
  if(!r.ok)throw new Error(`Gmail API ${r.status}: ${await r.text()}`);
  return r.json();
}

function gmailIsEscluso(from='',subject=''){
  const f=from.toLowerCase();
  return GMAIL_ESCLUSI.some(d=>f.includes(d));
}
function gmailIsCandidato(from='',subject=''){
  const f=from.toLowerCase();const s=subject.toLowerCase();
  if(GMAIL_SENDERS.some(m=>f.includes(m.toLowerCase())))return true;
  if(GMAIL_KEYWORDS.some(k=>s.includes(k)))return true;
  return false;
}

Email:

Rispondi SOLO con JSON valido:

    return JSON.parse(t.slice(t.indexOf('{'),t.lastIndexOf('}')+1));

function gmailGetBody(payload){
  // Estrae testo plain da payload MIME
  if(!payload)return '';
  const parts=[payload,...(payload.parts||[])];
  for(const p of parts){
    if(p.mimeType==='text/plain'&&p.body?.data){
      return atob(p.body.data.replace(/-/g,'+').replace(/_/g,'/'));
    }
  }
  // fallback html → strip tags
  for(const p of parts){
    if(p.mimeType==='text/html'&&p.body?.data){
      const html=atob(p.body.data.replace(/-/g,'+').replace(/_/g,'/'));
      return html.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim();
    }
  }
  return '';
}

function gmailGetPdfAttachment(payload){
  // Ritorna {attachmentId, filename} del primo PDF trovato, o null
  const walk=(p)=>{
    if(!p)return null;
    if(p.mimeType==='application/pdf'&&p.body?.attachmentId)
      return {attachmentId:p.body.attachmentId,filename:p.filename||'ricevuta.pdf'};
    for(const sub of (p.parts||[])){const r=walk(sub);if(r)return r;}
    return null;
  };
  return walk(payload);
}

async function gmailDownloadPdf(msgId,attachmentId){
  const d=await gmailFetch(`/users/me/messages/${msgId}/attachments/${attachmentId}`);
  const raw=d.data.replace(/-/g,'+').replace(/_/g,'/');
  const bin=atob(raw);
  const bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  return new Blob([bytes],{type:'application/pdf'});
}

function gmailEmailHtml(from,subject,date,bodyText){

  return `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>${subject}</title>

  <pre>${bodyText.replace(/</g,'&lt;').replace(/>/g,'&gt;')}</pre></body></html>`;
}

let _gmailRisultati=[];

async function scansionaGmail(){
  if(!tok){alert('Accedi prima con Google');return;}

  // Range mese corrente
  const oggi=new Date();
  const inizio=new Date(oggi.getFullYear(),oggi.getMonth(),1);
  const after=Math.floor(inizio.getTime()/1000);
  const before=Math.floor(oggi.getTime()/1000)+86400;

  spin(true,'📧 Cerco ricevute in Gmail...');
  try{
    // Query Gmail
    const senderQ=GMAIL_SENDERS.map(s=>`from:${s}`).join(' OR ');
    const kwQ=GMAIL_KEYWORDS.map(k=>`subject:${k}`).join(' OR ');
    const query=`(${senderQ} OR ${kwQ}) after:${after} before:${before}`;

    const list=await gmailFetch('/users/me/messages',{q:query,maxResults:'50'});
    const msgs=list.messages||[];

    if(!msgs.length){spin(false);alert('📭 Nessuna email trovata per questo mese.');return;}

    spin(true,`📧 Analizzo ${msgs.length} email con Claude...`);
    const risultati=[];

    for(let i=0;i<msgs.length;i++){
      spin(true,`📧 Analizzo email ${i+1}/${msgs.length}...`);
      try{
        const msg=await gmailFetch(`/users/me/messages/${msgs[i].id}`,{format:'full'});
        const headers=msg.payload?.headers||[];
        const from=headers.find(h=>h.name.toLowerCase()==='from')?.value||'';
        const subject=headers.find(h=>h.name.toLowerCase()==='subject')?.value||'';
        const dateH=headers.find(h=>h.name.toLowerCase()==='date')?.value||'';

        // Escludi Microsoft 365 Personal
        if(gmailIsEscluso(from,subject))continue;
        // Pre-filtro: deve sembrare una ricevuta
        if(!gmailIsCandidato(from,subject))continue;

        const bodyText=gmailGetBody(msg.payload);
        const pdf=gmailGetPdfAttachment(msg.payload);

        // Claude analizza
        const ai=await aiAnalizzaEmail(from,subject,bodyText);
        if(!ai||ai.rimborsabile===false)continue;

        // Estrai data dal header email → formato GG/MM/AAAA
        let dataFmt='';
        try{
          const d=new Date(dateH);
          dataFmt=`${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;
        }catch{}

        risultati.push({
          msgId:msgs[i].id,
          from,subject,dateH,dataFmt,
          bodyText,pdf,
          ai,
          tipo:ai.rimborsabile===true?'verde':'gialla',
          selezionato:ai.rimborsabile===true, // auto-seleziona i certi
          rispostaUtente:null // per le domande gialle
        });
      }catch(e){console.error('Err msg:',msgs[i].id,e);}
    }

    spin(false);
    _gmailRisultati=risultati;

    if(!risultati.length){alert('✅ Nessuna ricevuta rimborsabile trovata questo mese.');return;}
    mostraModalGmail();
  }catch(e){
    spin(false);
    console.error('Gmail scan err:',e);
    alert('❌ Errore Gmail:\n'+e.message+'\n\nAssicurati di aver dato il permesso Gmail al login.');
  }
}

function genDocxBlob(mNum,anno){
  // Calcola totali per categoria secondo schema dichiarazione
  const mLabel=String(mNum).padStart(2,'0');
  const mLabelYY=`${mLabel}/${String(anno).slice(2)}`;
  const oggi=new Date(anno,mNum-1,1);
  const giorni=new Date(anno,mNum,0).getDate();
  const dataInizio=`01 / ${mLabel} /${String(anno).slice(2)}`;
  const dataFine=`${String(giorni).padStart(2,'0')} / ${mLabel} /${String(anno).slice(2)}`;

  // Mappa categorie app → righe dichiarazione
  const CAT_DICH={
    'Ristoranti':  'RISTORAZIONE/BAR',
    'Alloggio':    'ALLOGGIO',
    'Automobile':  'AUTOVETTURE/AUTOMEZZI',
    'Gasolio':     'RIFORNIMENTO CARBURANTE',
    'Alimentari':  'RISTORAZIONE/BAR',
    'Farmacia':    'ALTRO',
    'Trasporti':   'TRENO',
    'Altro':       'ALTRO'
  };

  // Aggrega per riga
  const righe={
    'TRENO':0,'AEREO':0,'ALLOGGIO':0,'RISTORAZIONE/BAR':0,
    'MATERIALE DI PRODUZIONE':0,'AUTOVETTURE/AUTOMEZZI':0,
    'TAXI':0,'RIFORNIMENTO CARBURANTE':0,'ALTRO':0
  };
  const altroDettagli=[];
  sc.forEach(s=>{
    const imp=parseFloat(s.totale)||0;
    const dest=CAT_DICH[s.categoria]||'ALTRO';
    righe[dest]=(righe[dest]||0)+imp;
    if(dest==='ALTRO'&&!['Farmacia'].includes(s.categoria)&&!CAT_DICH[s.categoria]){
      altroDettagli.push(s.categoria);
    }
    if(s.categoria==='Farmacia'||(!CAT_DICH[s.categoria])){
      righe['ALTRO']=(righe['ALTRO']||0)+imp;
      if(s.categoria==='Farmacia') righe['RISTORAZIONE/BAR']-=imp; // non sommare doppio
    }
  });
  // Ri-calcola con logica corretta
  Object.keys(righe).forEach(k=>righe[k]=0);
  sc.forEach(s=>{
    const imp=parseFloat(s.totale)||0;
    const cat=s.categoria;
    if(cat==='Ristoranti'||cat==='Alimentari') righe['RISTORAZIONE/BAR']+=imp;
    else if(cat==='Alloggio') righe['ALLOGGIO']+=imp;

<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">

  };

  // ZIP builder minimale
  function zipFiles(entries){
    const crc32Table=(()=>{const t=new Uint32Array(256);for(let i=0;i<256;i++){let c=i;for(let j=0;j<8;j++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[i]=c;}return t;})();
    const crc32=(buf)=>{let c=0xFFFFFFFF;for(let i=0;i<buf.length;i++)c=crc32Table[(c^buf[i])&0xFF]^(c>>>8);return(c^0xFFFFFFFF)>>>0;};
    const u16=(n)=>[n&0xFF,(n>>8)&0xFF];const u32=(n)=>[n&0xFF,(n>>8)&0xFF,(n>>16)&0xFF,(n>>24)&0xFF];
    const parts=[];const centralDir=[];let offset=0;
    for(const [name,data] of Object.entries(entries)){
      const nameBytes=enc.encode(name);const crc=crc32(data);
      const lh=[0x50,0x4B,0x03,0x04,0x14,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,
        ...u32(crc),...u32(data.length),...u32(data.length),...u16(nameBytes.length),...u16(0),...nameBytes,...data];
      centralDir.push([0x50,0x4B,0x01,0x02,0x14,0x00,0x14,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,
        ...u32(crc),...u32(data.length),...u32(data.length),...u16(nameBytes.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(offset),...nameBytes]);
      offset+=lh.length;parts.push(new Uint8Array(lh));

    const cdStart=offset;let cdLen=0;

      ...u16(centralDir.length),...u16(centralDir.length),...u32(cdLen),...u32(cdStart),...u16(0)]);
    const all=[...parts,...cdParts,eocd];
    const total=all.reduce((a,p)=>a+p.length,0);
    const out=new Uint8Array(total);let pos=0;
    for(const p of all){out.set(p,pos);pos+=p.length;}
    return out;
  }

const MESI_NOMI={1:'GENNAIO',2:'FEBBRAIO',3:'MARZO',4:'APRILE',5:'MAGGIO',6:'GIUGNO',
  7:'LUGLIO',8:'AGOSTO',9:'SETTEMBRE',10:'OTTOBRE',11:'NOVEMBRE',12:'DICEMBRE'};

async function uploadToDrive(blob, fileName, mimeType, parentId){
  const meta={name:fileName,parents:[parentId]};
  const boundary='-------spese'+Date.now();
  const body=[
    `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n`,
    `--${boundary}\r\nContent-Type: ${mimeType}\r\n\r\n`,
    blob,
    `\r\n--${boundary}--`
  ];
  // Costruisci ArrayBuffer da parts
  const parts=[];
  for(const p of body){
    if(typeof p==='string') parts.push(new TextEncoder().encode(p));
    else parts.push(new Uint8Array(await p.arrayBuffer()));
  }
  const total=parts.reduce((a,p)=>a+p.length,0);
  const buf=new Uint8Array(total);
  let off=0;
  for(const p of parts){buf.set(p,off);off+=p.length;}
  const r=await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&supportsAllDrives=true',{
    method:'POST',
    headers:{'Authorization':'Bearer '+tok,'Content-Type':`multipart/related; boundary=${boundary}`},
    body:buf
  });
  const d=await r.json();
  if(d.error)throw new Error(d.error.message||JSON.stringify(d.error));
  return d.id;
}

async function trovaCreaCartella(parentId, nomeParziale, nomeCompleto){
  // cerca per prefisso numerico (es "09" dentro "09 SETTEMBRE")
  const params=new URLSearchParams({
    q:`'${parentId}' in parents and mimeType='application/vnd.google-apps.folder' and trashed=false and name contains '${nomeParziale}'`,
    fields:'files(id,name)',pageSize:'20',supportsAllDrives:'true',includeItemsFromAllDrives:'true'
  });
  const r=await fetch(`https://www.googleapis.com/drive/v3/files?${params}`,{headers:{Authorization:'Bearer '+tok}});
  const d=await r.json();
  if(d.files&&d.files.length>0)return d.files[0].id;
  // Non trovata: crea
  const r2=await fetch('https://www.googleapis.com/drive/v3/files?supportsAllDrives=true',{
    method:'POST',
    headers:{'Authorization':'Bearer '+tok,'Content-Type':'application/json'},
    body:JSON.stringify({name:nomeCompleto,mimeType:'application/vnd.google-apps.folder',parents:[parentId]})
  });
  const d2=await r2.json();
  if(d2.error)throw new Error('Cartella non trovata e non creabile: '+d2.error.message);
  return d2.id;
}

async function salvasuDrive(){
  if(!sc.length){alert('Nessuno scontrino da salvare');return;}
  if(!tok){alert('Accedi prima con Google');return;}

  const oggi=new Date();
  const mNum=oggi.getMonth()+1;
  const anno=oggi.getFullYear();
  const mLabel=String(mNum).padStart(2,'0');
  const nomeMese=`${mLabel} ${MESI_NOMI[mNum]}`;

  spin(true,'Cerco cartella anno su Drive...');
  try{
    // Trova/crea cartella anno dentro ZZZ NOTA SPESE
    const annoId=await trovaCreaCartella(ZZZ_ID,String(anno),String(anno));
    spin(true,`Cerco cartella ${nomeMese}...`);
    // Trova/crea cartella mese

    spin(true,'Carico Excel su Drive...');
    const xlsxId=await uploadToDrive(xlsxBlob,xlsxName,'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',meseId);

    // Carica PDF scontrini come HTML
    spin(true,'Genero PDF scontrini...');
    const htmlScontrini=genHtmlScontrini();
    const blobScontrini=new Blob([htmlScontrini],{type:'text/html;charset=utf-8'});
    await uploadToDrive(blobScontrini,`Scontrini_${mLabel}_${anno}.html`,'text/html',meseId);

    // Carica PDF Q8 se ci sono rifornimenti
    const gasItems=sc.filter(s=>s.categoria==='Gasolio');
    if(gasItems.length>0){
      spin(true,'Genero PDF Q8...');
      const htmlQ8=genHtmlQ8();
      const blobQ8=new Blob([htmlQ8],{type:'text/html;charset=utf-8'});
      await uploadToDrive(blobQ8,`Ricevute_Q8_${mLabel}_${anno}.html`,'text/html',meseId);
    }

    // Genera e carica DOCX dichiarazione
    spin(true,'Genero dichiarazione Word...');
    const docxBlob=genDocxBlob(mNum,anno);
    const docxName=`nota_spese_dichiarazione_${mLabel}_${String(anno).slice(2)}.docx`;
    await uploadToDrive(docxBlob,docxName,'application/vnd.openxmlformats-officedocument.wordprocessingml.document',meseId);

    spin(false);
    alert(`✅ File caricati su Drive!\n\nCartella: ${anno} / ${nomeMese}\n• ${xlsxName}\n• ${docxName}\n• Scontrini_${mLabel}_${anno}.html${gasItems.length>0?`\n• Ricevute_Q8_${mLabel}_${anno}.html`:''}`);
  }catch(e){
    spin(false);
    console.error('Drive upload error:',e);

  ];
  let prevKm=kmP;

// Genera HTML Q8 per upload Drive
function genHtmlQ8(){
  const gas=sc.filter(s=>s.categoria==='Gasolio').sort((a,b)=>{
    const da=a.data?a.data.split('/').reverse().join(''):'0',db=b.data?b.data.split('/').reverse().join(''):'0';return da>db?1:-1;
  });
  const tot=gas.reduce((a,s)=>a+(parseFloat(s.totale)||0),0);
  let prevKm=kmP;
  const oggi=new Date();const mNum=oggi.getMonth()+1;const anno=oggi.getFullYear();
  const mLabel=String(mNum).padStart(2,'0');
  const righe=gas.map(s=>{
    const km=parseFloat(s.km)||0;const dKm=km&&prevKm?(km-prevKm):null;
    const lt=s.litri?parseFloat(s.litri):null;const ltKm=dKm&&lt?(lt/dKm*100).toFixed(1):null;
    if(km)prevKm=km;
    return `<div style="page-break-inside:avoid;margin-bottom:16px;border:1px solid #ccd;border-radius:8px;overflow:hidden">
      <div style="background:#3a1010;color:#fff;padding:8px 12px;display:flex;justify-content:space-between">
        <div><div style="font-size:14px;font-weight:bold">⛽ ${s.negozio||'Q8'}</div>
        <div style="font-size:10px;opacity:.6">${s.data||'n.d.'}</div></div>
        <div style="font-size:16px;font-weight:bold;color:#ff8a80">€ ${parseFloat(s.totale||0).toFixed(2)}</div>
      </div>
      ${s.preview?`<div style="text-align:center;padding:4px;background:#f8f8fa"><img src="${s.preview}" style="max-width:100%;max-height:260px;object-fit:contain"></div>`:'<div style="padding:12px;text-align:center;color:#aaa;font-size:12px">📁 Da Drive</div>'}
      <div style="padding:6px 12px;font-size:10px;color:#666;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;border-top:1px solid #eee">
        <span>Km: <b>${km?km.toLocaleString():'—'}</b></span>
        <span>Litri: <b>${lt?lt.toFixed(1):'—'}</b></span>
        <span>€/Lt: <b>${s.prezzoLitro?parseFloat(s.prezzoLitro).toFixed(3):'—'}</b></span>
        <span>Δ km: <b>${dKm?Math.round(dKm):'—'}</b></span>
        <span>Lt/100: <b>${ltKm?ltKm+' L':'—'}</b></span>
      </div></div>`;
  }).join('');
  return `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Ricevute Q8 ${mLabel}/${anno}</title>
  <style>body{margin:0;padding:20px;font-family:Arial,sans-serif;max-width:700px;margin:0 auto}
  @media print{body{padding:0}}</style></head><body>
  <h1 style="font-size:20px;margin:0 0 4px">Ricevute Q8 / Gasolio ${mLabel}/${anno}</h1>
  <p style="color:#888;font-size:11px;border-bottom:2px solid #eee;padding-bottom:10px;margin-bottom:16px">D'Aniello Giuseppe · ${gas.length} rifornimenti · Totale: € ${tot.toFixed(2)} · Km partenza: ${kmP.toLocaleString()}</p>
  ${righe}</body></html>`;
}

async function startApp(){
  document.getElementById('login').style.display='none';
  document.getElementById('app').classList.add('on');
  render();
  // Prova a caricare i km del mese precedente da Drive
  await aggiornaKmDaDrive();
}

async function aggiornaKmDaDrive(){
  try{
    const oggi=new Date();
    const mesePrec=oggi.getMonth()===0?12:oggi.getMonth(); // mese precedente (1-12)
    const annoPrec=oggi.getMonth()===0?oggi.getFullYear()-1:oggi.getFullYear();
    // Trova cartella anno
    const res=await fetch(
      `https://www.googleapis.com/drive/v3/files?q='${ZZZ_ID}' in parents and mimeType='application/vnd.google-apps.folder' and name='${annoPrec}'&fields=files(id,name)`,
      {headers:{Authorization:'Bearer '+tok}});
    const data=await res.json();
    if(!data.files||!data.files.length)return;
    const km=await leggiKmMesePrecedente(data.files[0].id, mesePrec);
    if(km&&km!==kmP){
      kmP=km;
      save();
      console.log('Km aggiornati da Drive:', km);
    }
  }catch(e){console.error('aggiorna km err:',e);}
}

  if(tok)startApp();else document.getElementById('login').style.display='flex';
};
